database_url: sqlite:///data/busstop_flow.db
detector:
  model: yolo11n.pt
  confidence: 0.35
  iou: 0.50
  device: auto
  tracker: bytetrack.yaml
cameras:
  front:
    role: front
    # Mandatory service policy: A -> B is boarding; reverse travel is not counted.
    event_direction: IN
    source: null
    # Provisional for the supplied 320x240 FRONT frame: outside pavement -> entry steps.
    # Confirm with moving footage; the sample still does not prove crossing direction.
    zone_a: [[0.35, 0.20], [0.75, 0.20], [0.78, 0.64], [0.38, 0.64]]
    zone_b: [[0.44, 0.69], [0.79, 0.69], [0.82, 0.96], [0.43, 0.96]]
    min_stable_frames: 2
    debounce_frames: 12
    state_ttl_frames: 90
    anchor_mode: bottom_center
    time_offset_ms: 0
  rear:
    role: rear
    # Mandatory service policy: A -> B is alighting; reverse travel is not counted.
    event_direction: OUT
    source: null
    # Provisional for the supplied 320x240 REAR frame: cabin -> exit threshold.
    # Confirm the direction and visible person anchor against moving footage.
    zone_a: [[0.18, 0.78], [0.82, 0.78], [0.90, 0.98], [0.10, 0.98]]
    zone_b: [[0.22, 0.53], [0.78, 0.53], [0.85, 0.73], [0.15, 0.73]]
    min_stable_frames: 2
    debounce_frames: 12
    state_ttl_frames: 90
    anchor_mode: bottom_center
    time_offset_ms: 0

