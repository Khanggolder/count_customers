database_url: sqlite:///data/busstop_flow.db
detector:
  model: yolo11n.pt
  confidence: 0.35
  iou: 0.50
  device: auto
  tracker: bytetrack.yaml
cameras:
  front:
    role: front
    # Mandatory service policy: A -> B is boarding; reverse travel is not counted.
    event_direction: IN
    source: null
    zone_a: [[0.20, 0.05], [0.54, 0.05], [0.54, 0.98], [0.20, 0.98]]
    zone_b: [[0.56, 0.05], [0.98, 0.05], [0.98, 0.98], [0.56, 0.98]]
    min_stable_frames: 2
    debounce_frames: 12
    state_ttl_frames: 90
    anchor_mode: bottom_center
    time_offset_ms: 0
  rear:
    role: rear
    # Mandatory service policy: A -> B is alighting; reverse travel is not counted.
    event_direction: OUT
    source: null
    zone_a: [[0.05, 0.05], [0.95, 0.05], [0.95, 0.48], [0.05, 0.48]]
    zone_b: [[0.05, 0.52], [0.95, 0.52], [0.95, 0.95], [0.05, 0.95]]
    min_stable_frames: 2
    debounce_frames: 12
    state_ttl_frames: 90
    anchor_mode: bottom_center
    time_offset_ms: 0

