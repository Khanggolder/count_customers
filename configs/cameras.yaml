database_url: sqlite:///data/busstop_flow.db
detector:
  model: yolo11n.pt
  confidence: 0.35
  iou: 0.50
  device: auto
  tracker: bytetrack.yaml
# Experimental REAR cabin headcount only. This ROI is independent of door Zone A/B.
# Full frame is a starting point; calibrate ROI/ignore on the actual cabin video.
rear_occupancy:
  model: 11n-head.pt
  confidence: 0.35
  iou: 0.50
  imgsz: 640
  device: auto
  roi: [[0.0, 0.0], [1.0, 0.0], [1.0, 1.0], [0.0, 1.0]]
  ignore: []
  smoothing_window: 1
# Experimental REAR head tracking. A = inside; B = outside/downstream.
# Calibrate on a rear-door video: the zones below are only a starting point.
# This mode never persists PassengerEvent or changes the door_out configuration.
rear_head_out:
  model: 11n-head.pt
  tracker: bytetrack.yaml
  confidence: 0.35
  iou: 0.50
  imgsz: 640
  device: auto
  roi: [[0.0, 0.0], [1.0, 0.0], [1.0, 1.0], [0.0, 1.0]]
  zone_a: [[0.575, 0.12666666666666668], [0.57, 0.38222222222222224], [0.53625, 0.3711111111111111], [0.54625, 0.14444444444444443]]
  zone_b: [[0.58625, 0.13555555555555557], [0.66, 0.14444444444444443], [0.645, 0.3844444444444444], [0.585, 0.37777777777777777]]
  min_stable_frames: 2
  state_ttl_frames: 90
  id_switch_grace_frames: 5
  id_switch_max_distance: 0.08
cameras:
  front:
    role: front
    # Mandatory service policy: A -> B is boarding; reverse travel is not counted.
    event_direction: IN
    source: null
    zone_a: [[0.19375, 0.16666666666666666], [0.2775, 0.4222222222222222], [0.24875, 0.8177777777777778], [0.00375, 0.5333333333333333]]
    zone_b: [[0.3, 0.4311111111111111], [0.5125, 0.4288888888888889], [0.47875, 0.8755555555555555], [0.27125, 0.8266666666666667]]
    min_stable_frames: 2
    debounce_frames: 12
    state_ttl_frames: 90
    anchor_mode: bottom_center
    time_offset_ms: 0
  rear:
    role: rear
    # Mandatory service policy: A -> B is alighting; reverse travel is not counted.
    event_direction: OUT
    source: null
    zone_a: [[0.575, 0.12666666666666668], [0.57, 0.38222222222222224], [0.53625, 0.3711111111111111], [0.54625, 0.14444444444444443]]
    zone_b: [[0.58625, 0.13555555555555557], [0.66, 0.14444444444444443], [0.645, 0.3844444444444444], [0.585, 0.37777777777777777]]
    min_stable_frames: 2
    debounce_frames: 12
    state_ttl_frames: 90
    anchor_mode: bottom_center
    time_offset_ms: 0
