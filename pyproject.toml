[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "busstop-flow-ai"
version = "0.2.0"
description = "Bus stop passenger flow MVP: YOLO/ByteTrack, stop visits, telemetry, API and dashboard"
requires-python = ">=3.11,<3.13"
dependencies = [
  "anyio==4.8.0",
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "sqlalchemy==2.0.36",
  "pydantic-settings==2.7.1",
  "python-multipart==0.0.20",
  "numpy==1.26.4",
  "opencv-python==4.10.0.84",
  "imageio-ffmpeg==0.6.0",
  "PyYAML==6.0.2",
  "Pillow==11.0.0",
  "requests==2.32.3",
  "streamlit==1.41.1",
  "pandas==2.2.3",
  "pyarrow==18.1.0",
  "plotly==5.24.1",
  "ultralytics==8.3.57",
  "lap==0.5.13",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "pytest-cov==6.0.0", "httpx==0.28.1", "ruff==0.8.4"]

[project.scripts]
busstop-demo = "busreid.cli:demo_main"

[tool.setuptools.packages.find]
include = ["busreid*", "backend*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings"
markers = ["network: needs internet", "gpu: needs CUDA", "integration: external integration"]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"backend/main.py" = ["B008"]
